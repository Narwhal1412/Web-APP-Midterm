info:
  name: Login Endpoint
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8000/api/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "test@gmail.com",
        "password": "Test@123"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Request Body**
  * `email` *(string, required, max 255, unique)*
  * `password` *(string, required, min 8)*

  **Responses**
  * **200 Logged-in**
  ```json
  {
    "user": {},
    "token": "1|abc123..."
  }
  ```
  * **422 Unprocessable Entity** — Missing/Invalid format, wrong email/password.

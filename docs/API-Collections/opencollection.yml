opencollection: 1.0.0

info:
  name: API-Collections
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

docs:
  content: |-
    
    ## Endpoints Overview

    | Method | Endpoint | Auth | Status Codes |
    | :--- | :--- | :--- | :--- |
    | `GET` | `/api/health` | No | `200`, `503` |
    | `POST` | `/api/register` | No | `201`, `422` |
    | `POST` | `/api/login` | No | `200`, `422` |
    | `POST` | `/api/logout` | Yes | `204`, `401` |
    | `POST` | `/api/user` | Yes | `200`, `422` |
    | `GET` | `/api/notes` | Yes | `200`, `401` |
    | `POST` | `/api/notes` | Yes | `201`, `401`, `422` |

    ## Refer to each endpoints docs for more details on request/response.
    Usually Status code 500 means database connection error, check health endpoint.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

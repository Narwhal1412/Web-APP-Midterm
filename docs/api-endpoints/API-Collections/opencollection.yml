opencollection: 1.0.0

info:
  name: API-Collections
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

docs:
  content: |
    | Method | Endpoint | Body | Response |
    |----------|----------|------|----------|
    | GET      | /api/notes | none | 200 users, or 401 | 
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

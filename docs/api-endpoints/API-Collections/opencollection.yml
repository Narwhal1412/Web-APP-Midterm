opencollection: 1.0.0

info:
  name: API-Collections
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

docs:
  content: |
    | Method | Auth | Endpoint | Request body | Success | Error|
    |--------|------|----------|--------------|----------|-----|
    | GET    | No   | /api/health | No | 200 | 503 |
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

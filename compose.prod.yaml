# This file is the override when ran on a production server

services:
   # Exposed via traefik
 frontend:
  container_name: webapp_frontend
  labels:
   - "traefik.enable=true"
   - "traefik.http.routers.${ROUTER}.rule=Host(`${APP_HOST}`)"
   - "traefik.http.routers.${ROUTER}.entrypoints=websecure"
   - "traefik.http.routers.${ROUTER}.tls=true"

  networks:
   - komodo_default

 backend: # Hidden, communicate via docker network
  container_name: webapp_backend
  networks:
   - komodo_default

 db: # Hidden, communicate via docker network
  container_name: webapp_db
  networks:
   - komodo_default
 
 redis:
  container_name: webapp_redis
  networks:
   - komodo_default

networks:
 komodo_default:
  external: true

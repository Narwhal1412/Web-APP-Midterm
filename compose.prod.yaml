# This file is the override when ran on a production server

services:
   # Exposed via traefik
 frontend:
  labels:
   - "traefik.enable=true"
   - "traefik.http.routers.webapp-midterm-dev.rule=Host(`${APP_HOST}`)"
   - "traefik.http.routers.webapp-midterm-dev.entrypoints=websecure"
   - "traefik.http.routers.webapp-midterm-dev.tls=true"

   # Authentication middleware
   - "traefik.http.routers.webapp-midterm-dev.middlewares=authentik@docker"
  networks:
   - komodo_default

 backend: # Hidden, communicate via docker network   
  networks:
   - komodo_default

 db: # Hidden, communicate via docker network   
  networks:
   - komodo_default
 
 redis:
  networks:
   - komodo_default
   
networks:
 komodo_default:
  external: true

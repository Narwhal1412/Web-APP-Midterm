server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's internal DNS. Re-resolve "backend" every 5s, so after the backend
  # container crashes and restarts with a new IP, nginx still finds it.
  # (A plain "proxy_pass http://backend:8000" resolves once at start-up: nginx would
  # refuse to start if the backend is down, and keep a stale IP after a restart.)
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    set $upstream backend:8000;
    proxy_pass http://$upstream;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
  }

  location / { try_files $uri /index.html; }
}
